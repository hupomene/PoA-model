name: PoA validation smoke tests
on:
  push:
    branches:
      - review/portfolio-flask-hardening
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install --upgrade pip
      - run: pip install 'numpy<2' 'scikit-learn==1.0.2' 'Flask<3' pandas
      - run: python -m unittest discover -v
